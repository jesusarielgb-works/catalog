name: Regenerate Catalog
on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:
  pull_request:
permissions:
  contents: write
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: npm test
  regenerate:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - name: Generate catalog README
        run: node scripts/generate-catalog.js
        env:
          # One fine-grained token, scoped to this organisation: contents read/write on
          # catalog and .github, metadata read on all repositories. Rotate it before it expires.
          GITHUB_TOKEN: ${{ secrets.CATALOG_TOKEN }}
          ORG_NAME: jesusarielgb-works
      - name: Commit README only when a work changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          [ -f works.json ] && git add works.json
          git diff --staged --quiet || { git commit -m "chore: regenerate catalog $(date -u '+%Y-%m-%d') [skip ci]" && git push; }
      - name: Update org profile only when a work changed
        run: node scripts/update-org-profile.js
        env:
          GITHUB_TOKEN: ${{ secrets.CATALOG_TOKEN }}
          ORG_NAME: jesusarielgb-works
