name: Regenerate Catalog
on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install
      - name: Generate catalog README
        run: node scripts/generate-catalog.js
        env:
          GITHUB_TOKEN: ${{ secrets.TOKEN_CATALOG }}
          ORG_NAME: jesusarielgb-works
      - name: Commit README
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          git diff --staged --quiet || git commit -m "chore: regenerate catalog $(date -u '+%Y-%m-%d') [skip ci]"
          git push
      - name: Update org profile
        run: node scripts/update-org-profile.js
        env:
          GITHUB_TOKEN: ${{ secrets.TOKEN_CATALOG }}
          ORG_NAME: jesusarielgb-works